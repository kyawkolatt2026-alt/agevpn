<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGE VPN - Premium Access</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #ff8c00;
            --accent-hover: #ffb74d;
            --border-color: #333;
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.5);
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: var(--font-family); 
            background-color: var(--bg-body); 
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .install-bar { 
            background: var(--bg-card); 
            padding: 12px 24px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-info { display: flex; align-items: center; gap: 14px; }
        .app-info img { 
            width: 48px; 
            height: 48px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .app-title { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
        .app-subtitle { font-size: 13px; color: var(--text-secondary); }
        
        .install-btn { 
            background: var(--accent); 
            color: #000; 
            padding: 10px 24px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .install-btn:hover { 
            background: var(--accent-hover); 
            transform: translateY(-2px);
        }

        .main-container { 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            flex-grow: 1;
        }

        .card { 
            background: var(--bg-card); 
            width: 100%; 
            max-width: 400px; 
            border-radius: 24px; 
            padding: 35px; 
            box-shadow: var(--shadow-card); 
            text-align: center; 
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        
        .logo-box { 
            width: 90px; 
            height: 90px; 
            margin: 0 auto 25px; 
            border-radius: 24px; 
            overflow: hidden; 
            border: 3px solid var(--accent);
            padding: 3px;
            background: #000;
            transition: 0.4s;
        }
        .logo-box:hover { transform: rotate(5deg) scale(1.05); }
        
        .logo-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            border-radius: 21px;
        }

        h1 { 
            font-size: 28px; 
            color: #fff; 
            margin: 10px 0; 
            font-weight: 900; 
            letter-spacing: -0.5px;
        }
        p { 
            color: var(--text-secondary); 
            font-size: 15px; 
            line-height: 1.7; 
            margin-bottom: 30px; 
            padding: 0 10px;
        }

        .download-btn { 
            background: var(--accent); 
            color: #000; 
            padding: 18px 30px; 
            border-radius: 14px; 
            text-decoration: none; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 800; 
            font-size: 16px;
            transition: all 0.4s ease; 
            animation: subtle-breath 3s infinite ease-in-out; 
            position: relative;
            z-index: 1;
        }
        
        @keyframes subtle-breath {
            0%, 100% { transform: scale(1); box-shadow: 0 5px 15px rgba(255, 140, 0, 0.3); }
            50% { transform: scale(1.03); box-shadow: 0 8px 25px rgba(255, 140, 0, 0.5); }
        }
        
        .download-btn:hover { 
            background: #fff; 
            color: #000;
            animation: none;
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.2);
        }

        .footer-credit {
            text-align: center;
            font-size: 12px;
            color: #444;
            padding: 20px;
        }

        @media (max-width: 480px) {
            .install-bar { padding: 10px 15px; }
            .app-info img { width: 40px; height: 40px; }
            .app-title { font-size: 16px; }
            .install-btn { padding: 8px 16px; font-size: 12px; }
            .card { padding: 25px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
